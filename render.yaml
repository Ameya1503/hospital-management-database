databases:
  - name: pulse-hms-db
    plan: free
    databaseName: pulse_hms
    user: pulse_hms_app

services:
  - type: web
    name: pulse-hms-django-api
    runtime: python
    plan: free
    rootDir: django-backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Safe for the single-instance free demo tier. Use a controlled release job in production.
    startCommand: python manage.py migrate --noinput && gunicorn hms.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-hms-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      # Lets the locally-run Vite frontend use localhost or 127.0.0.1 on any dev port.
      - key: DJANGO_CORS_ALLOWED_ORIGIN_REGEXES
        value: ^http://(localhost|127\.0\.0\.1):[0-9]+$
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
